name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium is needed: the `chrome` and `edge` projects are a local
      # convenience, and stock Chrome can no longer side-load unpacked
      # extensions anyway (see docs/E2E_TESTING.md).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build extension bundles
        run: npm run build:all

      - name: Run unit tests
        run: npm run test:unit

      - name: Run E2E suite
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
