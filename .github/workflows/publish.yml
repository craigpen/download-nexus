name: Publish to App Stores

on:
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: "Publish to Chrome Web Store"
        required: true
        default: true
        type: boolean
      publish_firefox:
        description: "Publish to Firefox Add-ons"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    uses: craigpen/extension-workflows/.github/workflows/publish.yml@main
    with:
      extension_name: "Download Nexus"
      build_command: "package"
      chrome_zip_path: "dist/download-nexus-chrome.zip"
      firefox_zip_path: "dist/firefox-mv3"
      edge_zip_path: "dist/download-nexus-chrome.zip"
      publish_chrome: ${{ inputs.publish_chrome }}
      publish_firefox: ${{ inputs.publish_firefox }}
      publish_edge: false
    secrets: inherit
