version: '3.8'

services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "8088:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      - /tmp/qbittorrent:/config
      - /tmp/qbittorrent/downloads:/downloads
    restart: unless-stopped
    networks:
      - dev-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.localhost`) || Host(`qbittorrent`)"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"

  transmission:
    image: linuxserver/transmission:latest
    container_name: transmission
    ports:
      - "9091:9091"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /tmp/transmission:/config
      - /tmp/transmission/downloads:/downloads
    restart: unless-stopped
    networks:
      - dev-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`transmission.localhost`) || Host(`transmission`)"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"

  deluge:
    image: linuxserver/deluge:latest
    container_name: deluge
    ports:
      - "8112:8112"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - DELUGE_LOGLEVEL=info
    volumes:
      - /tmp/deluge-linuxserver:/config
      - /tmp/deluge-linuxserver/downloads:/downloads
    restart: unless-stopped
    networks:
      - dev-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deluge.rule=Host(`deluge.localhost`) || Host(`deluge`)"
      - "traefik.http.services.deluge.loadbalancer.server.port=8112"

networks:
  dev-net:
    name: dev-net
    external: true
