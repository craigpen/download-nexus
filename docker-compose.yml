version: '3.8'

services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent-test
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      - /tmp/qbittorrent:/config
      - /tmp/qbittorrent/downloads:/downloads
    restart: unless-stopped

  transmission:
    image: linuxserver/transmission:latest
    container_name: transmission-test
    ports:
      - "9091:9091"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /tmp/transmission:/config
      - /tmp/transmission/downloads:/downloads
    restart: unless-stopped

  deluge-linuxserver:
    image: linuxserver/deluge:latest
    container_name: deluge-linuxserver-test
    ports:
      - "8112:8112"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - DELUGE_LOGLEVEL=info
    volumes:
      - /tmp/deluge-linuxserver:/config
      - /tmp/deluge-linuxserver/downloads:/downloads
    restart: unless-stopped

  deluge-official:
    image: deluge/deluge:latest
    container_name: deluge-official-test
    ports:
      - "8113:8112"
      - "6882:6881"
      - "6882:6881/udp"
    environment:
      - TZ=UTC
      - DELUGE_LOGLEVEL=info
    volumes:
      - /tmp/deluge-official:/config
      - /tmp/deluge-official/downloads:/downloads
    restart: unless-stopped
