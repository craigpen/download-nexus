version: '3.8'

services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      - /tmp/qbittorrent:/config
      - /tmp/qbittorrent/downloads:/downloads
    restart: unless-stopped

  transmission:
    image: linuxserver/transmission:latest
    container_name: transmission
    ports:
      - "9091:9091"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /tmp/transmission:/config
      - /tmp/transmission/downloads:/downloads
    restart: unless-stopped

  deluge:
    image: linuxserver/deluge:latest
    container_name: deluge
    ports:
      - "8112:8112"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - DELUGE_LOGLEVEL=info
    volumes:
      - /tmp/deluge-linuxserver:/config
      - /tmp/deluge-linuxserver/downloads:/downloads
    restart: unless-stopped

  aria2:
    image: p3terx/aria2-pro:latest
    container_name: aria2
    ports:
      - "6800:6800"
      - "6888:6888"
      - "6888:6888/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - aria2-config:/config
    tmpfs:
      - /downloads
    restart: unless-stopped

volumes:
  aria2-config:
  aria2-downloads:

